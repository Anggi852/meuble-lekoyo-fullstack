services:
  - type: web
    name: meuble-lekoyo-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        value: lekoyo2026
      - key: AUTH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GENAI_API_URL
        sync: false
      - key: STREAMLIT_DASHBOARD_URL
        sync: false
